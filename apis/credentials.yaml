          example: "eyJ0eXBlIjogIndlYmF1dGhuLOVB5ekdreS1BRzAwdnc4RXhFR0VpUGxXa1lyREpWbXY4d25jN2d3aWRKa3RwTTY1cTZIcTBaUTk0THRkcVItNXpzVXNoSnciLCAib3JpZ2luIjogImh0dHBzOi8vd2ViYXV0aG4uaW8iLCAiY3Jvc3NPcmlnaW4iOiBmYWxzZX0"
        signature:
          type: string
          example: "MEYCIQDqBfUEzQAAq-EToYfHl123ASDsaabuaetKIoGxd89FUAIhAOY7BlKMNOjSH_i3CWE_nEw2y_p8p2Dz7w786rMJvbID"
        userHandle:
          type: string
