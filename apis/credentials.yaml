              example: "0KtezDnN3F6bvxnWvbz0fAgMBPz_2XLmm2Sf1eeW7i8"
            rawId:
              type: string
              example: "0KtezDnN3F6bvxnWvbz0fAgMBPz_2XLmm2Sf1eeW7i8"
            type:
              type: string
