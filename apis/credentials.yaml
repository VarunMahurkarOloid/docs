      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
          example: eyJraWQiOiJJMXBBZVExaiswNzBuTDJOVUsxUUtTZWdlQXIxTUgwQ29yZ0...
          nullable: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: >-
                Exactly one of Pin, IDSearch1, IDSearch2, SecondaryID, Email or
                PrimaryID must be sent alongside ApplicationID and EndpointID.
                Leaving them all out is rejected with MISSING_FIELD, and
                SearchInput does not count as one of them.
              properties:
                ApplicationID:
                  type: string
                  pattern: ^[a-fA-F0-9]{32}$
                  maxLength: 32
                  minLength: 32
                  nullable: false
                  example: 70a4f870d7ef11ef97ef7fd6a9ac4856
                EndpointID:
                  type: string
                  pattern: ^[a-zA-Z0-9]{6}$
                  minLength: 6
                  maxLength: 6
                  nullable: false
                SearchInput:
                  type: string
                  nullable: true
                Pin:
                  type: string
                  nullable: true
                IDSearch1:
                  type: string
                  nullable: true
                IDSearch2:
                  type: string
                  nullable: true
                SecondaryID:
                  type: integer
                  nullable: true
                Email:
                  type: string
                  format: email
                  nullable: true
                PrimaryID:
                  type: string
                  nullable: true
                Transaction:
                  $ref: "#/components/schemas/Transaction"
              required:
              - ApplicationID
              - EndpointID
            examples:
              default:
                $ref: "#/components/examples/IDSearchLoginRequestExample"
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
