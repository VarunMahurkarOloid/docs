    FidokeyPublicRequest:
      type: object
      required:
      - origin
      - publicKey
      properties:
        origin:
          type: string
          format: uri
          example: https://webauthn.io
        publicKey:
          type: object
          required:
          - rp
          - user
          - challenge
          - pubKeyCredParams
          - timeout
          - authenticatorSelection
          - attestation
          properties:
            rp:
              type: object
              required:
              - name
              - id
              properties:
                name:
                  type: string
                  example: webauthn.io
                id:
                  type: string
                  example: webauthn.io
            user:
              type: object
              required:
              - id
              - name
              - displayName
              properties:
                id:
                  type: string
                  description: Base64URL-encoded user handle
                  example: webauthnio-testing
                name:
                  type: string
                  example: testing
                displayName:
                  type: string
                  example: testing
            challenge:
              type: string
              description: Base64URL-encoded cryptographic challenge
              example: C6g59W0Gi7zJSangXCZwSx5d-o_v8vE2eEK41JERAvxjlcvapvttvXeXGTnngbMsvPtSjOxIyzRZmPL1JTc9ow
            pubKeyCredParams:
              type: array
              minItems: 1
              items:
                type: object
                required:
                - type
                - alg
                properties:
                  type:
                    type: string
                    example: public-key
                  alg:
                    type: integer
                    description: COSE algorithm identifier
                    example: -7
            timeout:
              type: number
              description: Timeout in milliseconds
              example: 60000
            excludeCredentials:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: object
                  type:
                    type: string
                  transports:
                    type: array
                    items:
                      type: string
              example: [{"id": {}, "transports": ["internals"], "type": "public-key"}]
            authenticatorSelection:
              type: object
              properties:
                residentKey:
                  type: string
                  example: preferred
                requireResidentKey:
                  type: boolean
                  example: false
                userVerification:
                  type: string
                  example: preferred
            attestation:
              type: string
              example: none
            hints:
              type: array
              items:
                type: string
              example: []
            extensions:
              type: object
              properties:
                credProps:
                  type: boolean
                  example: true

    FidokeyPublicResponse:
      type: object
      required:
      - PublicKeyCredential
      - Error
      - UserCredential
      properties:
        PublicKeyCredential:
          $ref: "#/components/schemas/PublicKeyCredential"
        Error:
          type: boolean
          example: false
        UserCredential:
          $ref: "#/components/schemas/UserCredential"

    FidokeyAuthRequest:
      type: object
      properties:
        origin:
