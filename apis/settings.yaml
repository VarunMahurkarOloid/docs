components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
  schemas:
    Setting:
      type: object
      additionalProperties: false
      properties:
        ApplicationID:
          type: array
          items:
            type: string
            pattern: ^[a-fA-F0-9]{32}$
            maxLength: 32
            minLength: 32
            nullable: false
            example: 70a4f870d7ef11ef97ef7fd6a9ac4856
        AutoRefreshConfig:
          type: object
          additionalProperties: false
          nullable: true
          properties:
            RefreshTime:
              type: integer
              nullable: true
            TransactionRefresh:
              type: boolean
              nullable: true
        CloudKeyDistance:
          type: integer
          nullable: true
        CloudKeyProximityCheck:
          type: boolean
          nullable: true
        ConnectionTimeout:
          type: integer
          nullable: true
        CreatedAt:
          type: string
          format: date-time
          nullable: true
        Domain:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        DomainExt:
          type: string
          nullable: true
        EnableIntercomChat:
          type: boolean
          nullable: true
        FeatureFlag:
          $ref: '#/components/schemas/FeatureFlag'
        FirmwareVersion:
          type: number
          nullable: true
        GPSRefreshFrequency:
          type: integer
          nullable: true
        IdpSettings:
          $ref: '#/components/schemas/AdminSetting'
        IntentRSSI:
          type: integer
          nullable: true
        MultiDomain:
          type: boolean
          nullable: true
        newKey:
          type: string
          nullable: true
        PinConfiguration:
          $ref: '#/components/schemas/Configuration'
        PrimaryCredential:
          type: string
          nullable: true
        SelectedCredentials:
          type: array
          items:
            type: string
            nullable: true
          nullable: true
        SelectedUseCases:
          type: array
          items:
            type: string
            nullable: true
          nullable: true
        SettingType:
          type: string
          nullable: true
        SourceOfUsers:
          type: string
          nullable: true
        SuccessDelay:
          type: integer
          nullable: true
        SupervisorAccess:
          type: object
          nullable: true
          additionalProperties:
            type: boolean
            nullable: true
        SyncInactiveUsers:
          type: boolean
          nullable: true
        TenantIntents:
          $ref: '#/components/schemas/Intent'
        TenantInviteTemplate:
          type: object
          additionalProperties: false
          nullable: true
          properties:
            Face:
              $ref: '#/components/schemas/Face'
        UUIDs:
          type: array
          items:
            type: object
            additionalProperties: true
          nullable: true
        UpdatedAt:
          type: string
          format: date-time
          nullable: true
        UseSecretManagerForPasswords:
          type: boolean
          nullable: true
    Face:
      type: object
      additionalProperties: false
      properties:
        CaptureDate:
          type: string
          format: date-time
          nullable: true
        FaceID:
          type: string
          nullable: true
        ModelPVData:
          $ref: '#/components/schemas/Worker'
        OnlineModelFaceID:
          type: string
          nullable: true
        SignedUrl:
          type: string
          format: url
          nullable: true
        ReferenceImageURL:
          type: string
          format: url
          nullable: true
        Stability:
          type: integer
          nullable: true
        BodyHTML:
          type: string
          nullable: true
        SmsBody:
          type: string
          nullable: true
        Subject:
          type: string
          nullable: true
        ReturnPath:
          type: string
          nullable: false
        QueryParams:
          $ref: '#/components/schemas/Worker'
        Recipients:
          type: string
          nullable: true
        EmailBody:
          type: string
          nullable: true
        SendOnlySms:
          type: boolean
          nullable: true
        SmsRecipients:
          type: string
          nullable: true
        LoginUrl:
          type: string
          nullable: true
        httpStatusCode:
          type: integer
          nullable: false
        requestId:
          type: string
          nullable: true
          minLength: 32
          maxLength: 32
        attempts:
          type: integer
          nullable: true
        totalRetryDelay:
          type: number
          nullable: true
    GetSetting:
      type: object
      additionalProperties: false
      properties:
        Settings:
          type: array
          items:
            $ref: "#/components/schemas/Setting"
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        data:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorName:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
        code:
          type: integer
          nullable: true
    Worker:
