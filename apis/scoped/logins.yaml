openapi: 3.0.3
info:
  title: Login Documentation
  version: 1.0.0
  description: API documentation for managing Login.
  license:
    name: Apache 2.0
    url: https://www.oloid.ai
servers:
- url: https://integrations.oloidpreview.com
- url: https://api.oloidpreview.com
- url: https://api.oloiddev.com
paths:
  /login:
    post:
      summary: Login to get token.
      description: Authenticate the user and return tokens including IDToken, AccessToken, and RefreshToken.
      operationId: login
      tags:
      - Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              UserName: "ClientId"
              TenantName: "tenantname"
              Password: "ClientSecret"
      responses:
        "200":
          description: Successfully authenticated. Returns Cognito tokens (AccessToken, IdToken, RefreshToken) and user data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                default:
                  $ref: "#/components/examples/LoginExample"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                default:
                  $ref: "#/components/examples/BadRequestExample"
        "401":
          description: "Unauthorized: Access token is missing or invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                default:
                  $ref: "#/components/examples/UnauthorizedExample"
        "404":
          description: Does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                default:
                  $ref: "#/components/examples/NotFoundExample"
        "500":
          description: An error occurred on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                default:
                  $ref: "#/components/examples/InternalServerErrorExample"
        "502":
          description: "Bad Gateway: The proxy server received an invalid response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                default:
                  $ref: "#/components/examples/BadGatewayExample"
