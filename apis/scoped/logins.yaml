    CognitoToken:
      type: object
      additionalProperties: false
      required:
      - $metadata
      - AuthenticationResult
      - ChallengeParameters
      properties:
        $metadata:
          $ref: "#/components/schemas/MetaData"
        AuthenticationResult:
          $ref: "#/components/schemas/AuthenticationResult"
        ChallengeParameters:
          $ref: "#/components/schemas/ChallengeParams"
    MetaData:
      type: object
      additionalProperties: false
      required:
      - httpStatusCode
      - requestId
      - attempts
      - totalRetryDelay
      properties:
        httpStatusCode:
          type: integer
          description: This is the HTTP status code
          example: 200
          nullable: false
        requestId:
          type: string
          description: This is requestId
          example: 6607dfa0-4c7c-4d58-9393-08df997d9c0
          nullable: false
        attempts:
          type: integer
          description: This is the attempts count
          example: 3
          nullable: false
        totalRetryDelay:
          type: integer
          description: This is the total retry delay count
          example: 0
          nullable: false
    AuthenticationResult:
      type: object
      additionalProperties: false
      required:
      - AccessToken
      - IdToken
      - RefreshToken
      - ExpiresIn
      - TokenType
      properties:
        AccessToken:
          type: string
          description: The access token issued by Cognito.
          format: jwt
          example: eyJraWQiOiJKZ...
          nullable: false
        IdToken:
          type: string
          description: The ID token issued by Cognito.
          format: jwt
          example: eyJraWQiOiJGSl...
          nullable: false
        RefreshToken:
          type: string
          description: The refresh token used to obtain new tokens.
          format: jwt
          example: eyJjdHkiOiJKV1...
          nullable: false
        ExpiresIn:
          type: integer
          description: Expiration time in seconds for the token.
          example: 3600
          nullable: false
        TokenType:
          type: string
          description: The type of token issued.
          example: Bearer
          nullable: false
    ChallengeParams:
      type: object
      additionalProperties: true
      description: Challenge parameters returned by Cognito, usually empty if authentication succeeds.
      nullable: true
      example: {}
