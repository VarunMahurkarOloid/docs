          example: svc-9d... / {{ClientID}}
        TenantName:
          type: string
          nullable: false
          description: Name of the tenant associated with the user.
          example: preview
        Password:
          type: string
          format: password
          nullable: false
          description: Password associated with the username.
          example: QaERAs11 / {{ClientSecret}}
    LoginResponse:
      title: Tenant Login Response Schema
      type: object
      additionalProperties: false
      required:
